name: Build OpenWrt for BPI R4 Pro 4E

on:
  workflow_dispatch: # Allows you to manually trigger a build through the GitHub interface

jobs:
  build:
    runs-on: ubuntu-24.04 # fix ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Custom Configuration
        run: |
          # Applying the configuration for the bpi r4 pro 4e
          cat bpi-r4-pro.config > .config
          make defconfig

      - name: Download Packages
        run: make download -j8

      - name: Compile Firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4 # change v3 to v4
        with:
          name: openwrt-bpi-r4-pro-4e
          path: bin/targets/
